<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Armar rutina</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#050505}
.num{font-family:'Barlow Condensed',sans-serif;font-variant-numeric:tabular-nums}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
button:disabled{cursor:default;opacity:0.35}
input{font:inherit;color:inherit;background:none;border:0;outline:none;padding:0;margin:0;width:100%}
@keyframes rowin{0%{opacity:0;transform:translateY(-8px)}100%{opacity:1;transform:none}}
.rowin{animation:rowin 240ms cubic-bezier(0.22,1,0.36,1)}
</style>
</helmet>
<div style="width:393px;height:852px;box-sizing:border-box;padding-top:50px;background:#0B0B0C;color:#F4F4F2;font-family:'Barlow',sans-serif;position:relative;overflow:hidden">

  <div style="height:44px;padding:0 8px;display:flex;align-items:center;justify-content:space-between">
    <a href="P05-Rutinas.dc.html" style="height:44px;padding:0 8px;display:flex;align-items:center;gap:2px;color:#FF5B1F;font-size:16px;font-weight:600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>Rutinas
    </a>
    <span style="padding:0 10px;display:flex;align-items:center;gap:6px;font-size:13px;color:#9A9A9F" aria-live="polite">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#3DDC84" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Guardado
    </span>
  </div>

  <label style="margin:10px 16px 0;display:flex;flex-direction:column;gap:6px">
    <span style="font-size:11px;font-weight:700;letter-spacing:0.14em;color:#9A9A9F">NOMBRE DE LA RUTINA</span>
    <span class="num" style="display:block;padding-bottom:6px;border-bottom:2px solid #FF5B1F;font-size:38px;line-height:1.05;font-weight:800;text-transform:uppercase">
      <input type="text" value="{{name}}" onChange="{{onName}}" aria-label="Nombre de la rutina">
    </span>
  </label>

  <div style="margin:18px 16px 0;padding:0 8px 0 16px;min-height:68px;border-radius:14px;background:#141416;border:1px solid #2A2A2E;display:flex;align-items:center;gap:12px">
    <div style="flex:1;display:flex;flex-direction:column;gap:2px">
      <span style="font-size:16px;font-weight:600">Rutina activa</span>
      <span style="font-size:13px;color:#9A9A9F">La usamos para sugerirte el día en Hoy</span>
    </div>
    <button role="switch" aria-checked="{{active}}" aria-label="Rutina activa" onClick="{{toggleActive}}" style="width:68px;height:44px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;padding:0">
      <span style="position:relative;width:52px;height:32px;border-radius:16px;background:{{switchBg}};transition:background-color 200ms ease-out">
        <span style="position:absolute;top:3px;left:{{knobX}}px;width:26px;height:26px;border-radius:13px;background:#F4F4F2;box-shadow:0 2px 6px rgba(0,0,0,0.4);transition:left 220ms cubic-bezier(0.34,1.56,0.64,1)"></span>
      </span>
    </button>
  </div>

  <div style="margin:22px 16px 8px;display:flex;align-items:baseline;justify-content:space-between">
    <span style="font-size:12px;font-weight:700;letter-spacing:0.14em;color:#9A9A9F">DÍAS <span class="num" style="font-size:16px;color:#F4F4F2">{{count}}</span></span>
    <span style="font-size:12px;color:#7C7C82">Se entrenan en este orden</span>
  </div>

  <ol style="list-style:none;margin:0 16px;padding:0;display:flex;flex-direction:column;gap:6px">
    <sc-for list="{{days}}" as="d" hint-placeholder-count="4">
      <li class="{{d.anim}}" style="height:68px;box-sizing:border-box;padding:0 4px 0 0;border-radius:14px;background:#141416;border:1px solid #2A2A2E;display:flex;align-items:center;gap:4px">
        <span class="num" style="width:48px;align-self:stretch;display:flex;align-items:center;justify-content:center;border-right:1px solid #2A2A2E;font-size:26px;font-weight:800;color:#FF5B1F">{{d.n}}</span>
        <a href="P07-Armar-Dia.dc.html" style="flex:1;min-width:0;height:100%;padding-left:10px;display:flex;flex-direction:column;justify-content:center;gap:2px">
          <span class="num" style="font-size:22px;font-weight:700;text-transform:uppercase;line-height:1">{{d.name}}</span>
          <span style="font-size:13px;color:#9A9A9F">{{d.meta}}</span>
        </a>
        <button onClick="{{d.up}}" disabled="{{d.first}}" aria-label="{{d.upLabel}}" style="width:40px;height:44px;border:0;border-radius:10px;background:transparent;color:#C9C9CC;display:flex;align-items:center;justify-content:center">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
        </button>
        <button onClick="{{d.down}}" disabled="{{d.last}}" aria-label="{{d.downLabel}}" style="width:40px;height:44px;border:0;border-radius:10px;background:transparent;color:#C9C9CC;display:flex;align-items:center;justify-content:center">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
        </button>
        <button onClick="{{d.remove}}" aria-label="{{d.removeLabel}}" style="width:44px;height:44px;border:0;border-radius:10px;background:transparent;color:#9A9A9F;display:flex;align-items:center;justify-content:center">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
        </button>
      </li>
    </sc-for>
  </ol>

  <button onClick="{{addDay}}" style="margin:10px 16px 0;width:361px;height:56px;border-radius:14px;border:1.5px dashed #3A3A3F;background:transparent;color:#F4F4F2;display:flex;align-items:center;justify-content:center;gap:8px;font-size:16px;font-weight:700">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FF5B1F" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    Agregar día
  </button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      name: 'Fuerza 4 días',
      active: true,
      moved: null,
      days: [
        { id: 'a', name: 'Piernas A', ex: 4, sets: 14 },
        { id: 'b', name: 'Torso A', ex: 5, sets: 17 },
        { id: 'c', name: 'Piernas B', ex: 4, sets: 13 },
        { id: 'd', name: 'Torso B', ex: 5, sets: 16 }
      ]
    };
  }
  move(i, dir) {
    const days = this.state.days.slice();
    const j = i + dir;
    if (j < 0 || j >= days.length) return;
    const t = days[i]; days[i] = days[j]; days[j] = t;
    this.setState({ days: days, moved: t.id });
  }
  renderVals() {
    const days = this.state.days;
    return {
      name: this.state.name,
      onName: (e) => this.setState({ name: e.target.value }),
      active: this.state.active,
      toggleActive: () => this.setState({ active: !this.state.active }),
      switchBg: this.state.active ? '#FF5B1F' : '#3A3A3F',
      knobX: this.state.active ? 23 : 3,
      count: days.length,
      days: days.map((d, i) => ({
        n: i + 1,
        name: d.name,
        meta: d.ex === 0 ? 'Sin ejercicios todavía' : d.ex + ' ejercicios · ' + d.sets + ' series',
        first: i === 0,
        last: i === days.length - 1,
        anim: this.state.moved === d.id ? 'rowin' : '',
        upLabel: 'Subir ' + d.name, downLabel: 'Bajar ' + d.name, removeLabel: 'Eliminar ' + d.name,
        up: () => this.move(i, -1),
        down: () => this.move(i, 1),
        remove: () => this.setState({ days: days.filter((x) => x.id !== d.id) })
      })),
      addDay: () => this.setState({ days: days.concat([{ id: 'n' + Date.now(), name: 'Día ' + (days.length + 1), ex: 0, sets: 0 }]), moved: 'n' })
    };
  }
}
</script>
</body>
</html>
